name: Build pretty report (optional)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate simple index of examples
        run: |
          cat > docs/vibe-unpack/examples/INDEX.md << 'EOF'
          # vibe-unpack Example Index

          Auto-generated by GitHub Actions.

          EOF

          for dir in docs/vibe-unpack/examples/c*-*; do
            name=$(basename "$dir")
            echo "- [$name]($name/README.md)" >> docs/vibe-unpack/examples/INDEX.md
          done

          cat docs/vibe-unpack/examples/INDEX.md

      - name: Upload artifact (optional for future)
        uses: actions/upload-artifact@v4
        with:
          name: examples-index
          path: docs/vibe-unpack/examples/INDEX.md
