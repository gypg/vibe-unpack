name: Validate vibe-unpack examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Debug listing
        run: |
          set -x
          echo "=== find all example dirs ==="
          find docs/vibe-unpack/examples -maxdepth 1 -type d -name 'c*-*' | sort
          echo ""
          echo "=== tree of examples ==="
          find docs/vibe-unpack/examples -type f | sort
          echo ""
          echo "=== ls -la each c* dir ==="
          for d in $(find docs/vibe-unpack/examples -maxdepth 1 -type d -name 'c*-*' | sort); do
            echo "---- $d ----"
            ls -la "$d" || true
          done

      - name: Verify every example dir has the three required files
        run: |
          set -euo pipefail
          echo "=== Verifying required files with find ==="
          missing=0
          while IFS= read -r dir; do
            echo "Checking: $dir"
            for fname in demand-spec.md demand-graph.json README.md; do
              if [ ! -f "$dir/$fname" ]; then
                echo "MISSING: $dir/$fname"
                missing=1
              else
                echo "  OK: $fname"
              fi
            done
          done < <(find docs/vibe-unpack/examples -maxdepth 1 -type d -name 'c*-*' | sort)

          if [ "$missing" -eq 1 ]; then
            echo "❌ One or more required files are missing"
            exit 1
          fi
          echo "✅ All required files present for all examples."

      - name: Validate JSON structure for all demand-graph.json
        run: |
          set -e
          echo "=== Validating JSON files ==="
          errors=0
          while IFS= read -r f; do
            echo "Validating $f"
            if ! python3 -c '
import json, sys
try:
    with open(sys.argv[1], encoding="utf-8") as fh:
        data = json.load(fh)
    assert "version" in data
    assert isinstance(data.get("nodes"), list)
    assert isinstance(data.get("edges"), list)
    assert "decision_points" in data
    print(f"  ✅ {len(data[\"nodes\"])} nodes, {len(data[\"edges\"])} edges")
except Exception as e:
    print(f"  ❌ {e}")
    sys.exit(1)
' "$f"; then
              errors=$((errors+1))
            fi
          done < <(find docs/vibe-unpack/examples -type f -name 'demand-graph.json' | sort)

          if [ "$errors" -gt 0 ]; then
            echo "❌ $errors JSON validation error(s)"
            exit 1
          fi
          echo "✅ All JSON files are valid."

      - name: Check SKILL.md frontmatter
        run: |
          set -e
          echo "=== SKILL.md first 8 lines ==="
          head -8 docs/vibe-unpack/SKILL.md
          echo ""
          if ! grep -q "^name: vibe-unpack$" docs/vibe-unpack/SKILL.md; then
            echo "❌ 'name: vibe-unpack' line not found exactly"
            exit 1
          fi
          if ! grep -q "^description:" docs/vibe-unpack/SKILL.md; then
            echo "❌ 'description:' line not found"
            exit 1
          fi
          echo "✅ SKILL.md frontmatter OK."
