name: Validate vibe-unpack examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug tree
        run: |
          echo "=== Files under examples ==="
          find docs/vibe-unpack/examples -type f | sort || true

      - name: Verify required files (hardcoded)
        run: |
          set -e
          examples=(
            docs/vibe-unpack/examples/c1-child-daily
            docs/vibe-unpack/examples/c2-accounting
            docs/vibe-unpack/examples/c3-handmade-shop
            docs/vibe-unpack/examples/c4-fitness
            docs/vibe-unpack/examples/c5-family-album
            docs/vibe-unpack/examples/c6-novel-game
          )
          for dir in "${examples[@]}"; do
            echo "Checking $dir"
            ls -l "$dir/demand-spec.md" "$dir/demand-graph.json" "$dir/README.md"
          done
          echo "All required files exist."

      - name: Validate JSONs (hardcoded)
        run: |
          python3 - << 'PY'
import json
files = [
    "docs/vibe-unpack/examples/c1-child-daily/demand-graph.json",
    "docs/vibe-unpack/examples/c2-accounting/demand-graph.json",
    "docs/vibe-unpack/examples/c3-handmade-shop/demand-graph.json",
    "docs/vibe-unpack/examples/c4-fitness/demand-graph.json",
    "docs/vibe-unpack/examples/c5-family-album/demand-graph.json",
    "docs/vibe-unpack/examples/c6-novel-game/demand-graph.json",
]
for f in files:
    with open(f, encoding="utf-8") as fh:
        d = json.load(fh)
    assert "version" in d
    assert isinstance(d["nodes"], list)
    assert isinstance(d["edges"], list)
    assert "decision_points" in d
    print("OK:", f, len(d["nodes"]), "nodes")
print("All JSON OK")
PY

      - name: Check SKILL.md frontmatter (robust)
        run: |
          set -e
          echo "=== SKILL.md first 6 lines ==="
          head -6 docs/vibe-unpack/SKILL.md
          python3 - << 'PY'
import sys
with open("docs/vibe-unpack/SKILL.md", encoding="utf-8") as f:
    lines = f.readlines()
# Find the first non-empty line after possible ---
for i, line in enumerate(lines[:10]):
    if line.strip().startswith("name:"):
        if "vibe-unpack" in line:
            print("OK: found name: vibe-unpack near line", i+1)
            sys.exit(0)
print("FAIL: name: vibe-unpack not found in first 10 lines")
sys.exit(1)
PY
          echo "Frontmatter check passed."
