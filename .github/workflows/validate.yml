name: Validate vibe-unpack examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List examples tree
        run: |
          find docs/vibe-unpack/examples -type f | sort

      - name: Check required files
        run: |
          for dir in docs/vibe-unpack/examples/c1-child-daily docs/vibe-unpack/examples/c2-accounting docs/vibe-unpack/examples/c3-handmade-shop docs/vibe-unpack/examples/c4-fitness docs/vibe-unpack/examples/c5-family-album docs/vibe-unpack/examples/c6-novel-game; do
            for f in demand-spec.md demand-graph.json README.md; do
              if [ ! -f "$dir/$f" ]; then
                echo "MISSING $dir/$f"
                exit 1
              fi
            done
            echo "OK: $dir"
          done
          echo "All required files present."

      - name: Validate JSONs
        run: |
          python3 - << 'PY'
import json, glob, sys
err = []
for f in sorted(glob.glob("docs/vibe-unpack/examples/*/demand-graph.json")):
    try:
        d = json.load(open(f, encoding="utf-8"))
        assert "version" in d and isinstance(d["nodes"], list) and isinstance(d["edges"], list) and "decision_points" in d
        print("OK:", f)
    except Exception as e:
        err.append((f, str(e)))
        print("FAIL:", f, e)
if err:
    sys.exit(1)
print("All JSONs OK")
PY

      - name: Check SKILL.md
        run: |
          head -5 docs/vibe-unpack/SKILL.md
          grep -q '^name: vibe-unpack$' docs/vibe-unpack/SKILL.md || { echo "bad name"; exit 1; }
          grep -q '^description:' docs/vibe-unpack/SKILL.md || { echo "bad desc"; exit 1; }
          echo "SKILL frontmatter OK"
