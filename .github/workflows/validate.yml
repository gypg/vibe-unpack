name: Validate vibe-unpack examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List example directories
        run: |
          echo "=== Example directories ==="
          find docs/vibe-unpack/examples -maxdepth 1 -type d -name 'c*-*' | sort || true
          echo ""
          echo "=== All files under examples ==="
          find docs/vibe-unpack/examples -type f | sort || true

      - name: Check required files exist in every example
        run: |
          set -e
          echo "=== Checking required files ==="
          status=0
          while IFS= read -r dir; do
            echo "Dir: $dir"
            for f in demand-spec.md demand-graph.json README.md; do
              if [ -f "$dir/$f" ]; then
                echo "  ✓ $f"
              else
                echo "  ✗ MISSING $f"
                status=1
              fi
            done
          done < <(find docs/vibe-unpack/examples -maxdepth 1 -type d -name 'c*-*' | sort)
          if [ "$status" -ne 0 ]; then
            echo "Some required files are missing"
            exit 1
          fi
          echo "All required files present."

      - name: Validate demand-graph.json files
        run: |
          python3 - << 'PYEOF'
import json, glob, sys
errors = []
for f in sorted(glob.glob("docs/vibe-unpack/examples/*/demand-graph.json")):
    try:
        data = json.load(open(f, encoding="utf-8"))
        assert "version" in data
        assert isinstance(data.get("nodes"), list)
        assert isinstance(data.get("edges"), list)
        assert "decision_points" in data
        print(f"✓ {f.split('/')[-2]}: {len(data['nodes'])} nodes, {len(data['edges'])} edges")
    except Exception as e:
        errors.append((f, str(e)))
        print(f"✗ {f}: {e}")
if errors:
    print(f"\n{len(errors)} error(s)")
    sys.exit(1)
print("\nAll JSON files valid.")
PYEOF

      - name: Check SKILL.md frontmatter
        run: |
          set -e
          head -5 docs/vibe-unpack/SKILL.md
          grep -q '^name: vibe-unpack$' docs/vibe-unpack/SKILL.md || { echo "Missing exact 'name: vibe-unpack' line"; exit 1; }
          grep -q '^description:' docs/vibe-unpack/SKILL.md || { echo "Missing 'description:' line"; exit 1; }
          echo "✓ SKILL.md frontmatter OK"
