name: Validate vibe-unpack examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show tree (debug)
        run: |
          echo "=== All files ==="
          find docs/vibe-unpack -type f | sort || true

      - name: Check the 6 examples have their 3 files
        run: |
          set -e
          dirs=(
            "docs/vibe-unpack/examples/c1-child-daily"
            "docs/vibe-unpack/examples/c2-accounting"
            "docs/vibe-unpack/examples/c3-handmade-shop"
            "docs/vibe-unpack/examples/c4-fitness"
            "docs/vibe-unpack/examples/c5-family-album"
            "docs/vibe-unpack/examples/c6-novel-game"
          )
          for d in "${dirs[@]}"; do
            echo "Checking $d"
            ls -l "$d/demand-spec.md" "$d/demand-graph.json" "$d/README.md"
          done
          echo "All files present."

      - name: Validate all demand-graph.json
        run: |
          python3 - << 'PY'
import json, glob, sys, os
ok = True
for f in sorted(glob.glob("docs/vibe-unpack/examples/*/demand-graph.json")):
    try:
        data = json.load(open(f, encoding="utf-8"))
        assert "version" in data
        assert isinstance(data["nodes"], list)
        assert isinstance(data["edges"], list)
        assert "decision_points" in data
        name = os.path.basename(os.path.dirname(f))
        print(f"OK {name}: {len(data['nodes'])} nodes")
    except Exception as e:
        print(f"FAIL {f}: {e}")
        ok = False
if not ok:
    sys.exit(1)
print("All JSON OK")
PY

      - name: Check SKILL.md frontmatter (tolerant)
        run: |
          echo "=== SKILL.md head ==="
          head -8 docs/vibe-unpack/SKILL.md
          python3 - << 'PY'
import sys
with open("docs/vibe-unpack/SKILL.md", encoding="utf-8") as f:
    text = f.read()
if "name: vibe-unpack" in text and "description:" in text:
    print("SKILL frontmatter contains required keys")
else:
    print("SKILL frontmatter missing keys")
    sys.exit(1)
PY
          echo "Frontmatter check passed (contains check)."
