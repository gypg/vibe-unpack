name: Validate vibe-unpack examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List all example directories (debug)
        run: |
          echo "=== Example directories found ==="
          ls -d docs/vibe-unpack/examples/c*-* || true
          echo ""
          echo "=== Files inside each ==="
          for d in docs/vibe-unpack/examples/c*-*; do
            echo ">>> $d"
            ls -1 "$d" || echo "(empty or not dir)"
          done

      - name: Verify every example has the three required files
        run: |
          set -euo pipefail
          echo "Checking required files..."
          for dir in docs/vibe-unpack/examples/c*-*; do
            for file in demand-spec.md demand-graph.json README.md; do
              path="$dir/$file"
              if [ ! -f "$path" ]; then
                echo "❌ MISSING: $path"
                exit 1
              fi
            done
            echo "✅ $dir"
          done
          echo "All examples have the required files."

      - name: Validate JSON structure of all demand graphs
        run: |
          python3 - << 'PY'
import json, glob, sys

errors = []
for f in sorted(glob.glob("docs/vibe-unpack/examples/*/demand-graph.json")):
    try:
        with open(f) as fh:
            data = json.load(fh)
        assert "version" in data, "missing 'version'"
        assert isinstance(data.get("nodes"), list), "'nodes' must be a list"
        assert isinstance(data.get("edges"), list), "'edges' must be a list"
        assert "decision_points" in data, "missing 'decision_points'"
        print(f"✅ VALID: {f}  ({len(data['nodes'])} nodes / {len(data['edges'])} edges)")
    except Exception as e:
        errors.append((f, str(e)))
        print(f"❌ INVALID: {f} — {e}")

if errors:
    print("\n❌ JSON validation failed.")
    sys.exit(1)
print("\n✅ All JSON files are structurally valid.")
PY

      - name: Check SKILL.md has proper frontmatter
        run: |
          set -e
          echo "=== First lines of SKILL.md ==="
          head -6 docs/vibe-unpack/SKILL.md
          grep -q "^name: vibe-unpack$" docs/vibe-unpack/SKILL.md || { echo "❌ 'name: vibe-unpack' not found exactly"; exit 1; }
          grep -q "^description:" docs/vibe-unpack/SKILL.md || { echo "❌ 'description:' line missing"; exit 1; }
          echo "✅ SKILL.md frontmatter looks good."
