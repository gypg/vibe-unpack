name: Validate vibe-unpack examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug - list examples directory
        run: |
          echo "=== Checking out tree ==="
          find docs/vibe-unpack/examples -type f | sort || true
          echo "=== ls per example ==="
          for d in docs/vibe-unpack/examples/c*-*; do
            echo "---- $d ----"
            ls -1 "$d" || true
          done

      - name: Check all examples have required files
        run: |
          set -e
          echo "Checking example completeness..."
          missing=0
          for dir in docs/vibe-unpack/examples/c*-*; do
            echo "Checking $dir"
            for f in demand-spec.md demand-graph.json README.md; do
              if [ ! -f "$dir/$f" ]; then
                echo "MISSING $f in $dir"
                missing=1
              fi
            done
          done
          if [ "$missing" -eq 1 ]; then
            echo "Some files are missing!"
            exit 1
          fi
          echo "All examples have required files."

      - name: Validate all JSONs cleanly
        run: |
          python3 - << 'PYEOF'
import json, glob, sys
errors = []
for f in sorted(glob.glob("docs/vibe-unpack/examples/*/demand-graph.json")):
    try:
        data = json.load(open(f))
        assert "version" in data
        assert isinstance(data.get("nodes"), list)
        assert isinstance(data.get("edges"), list)
        assert "decision_points" in data
        print(f"VALID: {f} ({len(data['nodes'])} nodes, {len(data['edges'])} edges)")
    except Exception as e:
        errors.append((f, str(e)))
        print(f"INVALID: {f} - {e}")
if errors:
    print("\nErrors:")
    for f, e in errors:
        print(f"  {f}: {e}")
    sys.exit(1)
print("\nAll JSONs valid.")
PYEOF

      - name: Check SKILL.md frontmatter
        run: |
          set -e
          echo "=== SKILL.md head ==="
          head -8 docs/vibe-unpack/SKILL.md
          grep -q "^name: vibe-unpack" docs/vibe-unpack/SKILL.md || { echo "Missing or wrong 'name:'"; exit 1; }
          grep -q "^description:" docs/vibe-unpack/SKILL.md || { echo "Missing 'description:'"; exit 1; }
          echo "SKILL.md frontmatter OK."
