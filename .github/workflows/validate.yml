name: Validate vibe-unpack examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List tree
        run: find docs/vibe-unpack/examples -type f | sort

      - name: Check 6 examples have their files (pure shell)
        run: |
          set -e
          for d in \
            docs/vibe-unpack/examples/c1-child-daily \
            docs/vibe-unpack/examples/c2-accounting \
            docs/vibe-unpack/examples/c3-handmade-shop \
            docs/vibe-unpack/examples/c4-fitness \
            docs/vibe-unpack/examples/c5-family-album \
            docs/vibe-unpack/examples/c6-novel-game
          do
            ls "$d/demand-spec.md" "$d/demand-graph.json" "$d/README.md"
            echo "OK: $d"
          done
          echo "All files present"

      - name: Check SKILL.md has name and description
        run: |
          head -5 docs/vibe-unpack/SKILL.md
          grep -q "name: vibe-unpack" docs/vibe-unpack/SKILL.md
          grep -q "description:" docs/vibe-unpack/SKILL.md
          echo "SKILL.md OK"

      - name: SUCCESS
        run: echo "✅ All validation passed"
